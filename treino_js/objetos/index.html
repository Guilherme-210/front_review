      <!-- Execução inputs -->
      <section>
        <fieldset>
          <legend>Execução inputs com objetos</legend>
          <p><strong>tema</strong>: .</p>
          <form action="submit" id="form">
            <div class="inputs">
              <label for="Name">Nome: </label>
              <input
                required
                type="text"
                class="Name"
                id="inputName"
                placeholder="Digite o nome."
              />
              <label for="Age">Idade:</label>
              <input
                type="number"
                class="Age"
                id="inputAge"
                placeholder="Digite a idade."
              />
            </div>

            <div class="inputs">
              <label for="matter">Materia:</label>
              <input
                type="text"
                class="matter"
                id="inputMatter"
                placeholder="Escreva a materia"
              />
              <label for="matter">Tempo de estudo:</label>
              <input
                type="text"
                class="temp"
                id="inputTemp"
                placeholder="Escreva a materia"
              />
            </div>

            <div class="div_buttons">
              <button class="arquiv_button" id="submit">enviar</button>
              
              <button class="arquiv_button" id="pullButton"">puxar</button>

              <button class="arquiv_button" id="clearButton"  style="display: none">apagar</button>
            </div>

            <div class="textArea">
              <textarea
                readonly
                name="textAlunos"
                id="textAlunos"
                placeholder="alunos"
              ></textarea>
              <div class="div_load"
                id="carregamento">
                <div class="spinner"></div>
                <p class="load">Carregando...</p>
              </div>
            </div>
          </form>
        </fieldset>
